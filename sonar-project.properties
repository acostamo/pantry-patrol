# SonarCloud project identification
sonar.organization=acostamo
sonar.projectKey=acostamo_pantry-patrol
sonar.projectName=Pantry Patrol

# Source directories
sonar.sources=src
sonar.exclusions=src/**/*.spec.ts,src/environments/**,src/polyfills.ts,src/test.ts,src/zone-flags.ts,**/node_modules/**,**/dist/**,**/www/**,**/android/**,**/ios/**,**/coverage/**

# Test directories
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# Encoding
sonar.sourceEncoding=UTF-8

# TypeScript coverage (Karma → lcov)
sonar.javascript.lcov.reportPaths=coverage/app/lcov.info

# Coverage exclusions (boilerplate / generated / mocked code)
sonar.coverage.exclusions=src/**/*.spec.ts,src/environments/**,src/polyfills.ts,src/test.ts,src/zone-flags.ts,src/**/*.module.ts

# SCM
sonar.scm.provider=git
